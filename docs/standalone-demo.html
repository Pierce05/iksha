<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SACH — Situation Check</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FBF6EA;--card:#fff;--ink:#1B2430;--mut:#5b6472;--line:#1B2430;--pri:#1B2430;--prit:#FBF6EA;--acc:#E8A317;--bad:#A12A1F;--ok:#1F6B45;--unk:#7a5a00}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181f;--card:#1d232d;--ink:#f2ece0;--mut:#a9b0bb;--line:#f2ece0;--pri:#E8A317;--prit:#14181f;--bad:#ff8f84;--ok:#7fd6a4;--unk:#f0c765}}
:root[data-theme=dark]{--bg:#14181f;--card:#1d232d;--ink:#f2ece0;--mut:#a9b0bb;--line:#f2ece0;--pri:#E8A317;--prit:#14181f;--bad:#ff8f84;--ok:#7fd6a4;--unk:#f0c765}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Noto Sans Devanagari","Nirmala UI",Mukta,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:800;letter-spacing:.12em;font-size:20px}
button,.btn{font:inherit;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer;text-align:left;text-decoration:none;display:flex;align-items:center;gap:10px;width:100%;margin:8px 0}
.pri{background:var(--pri);color:var(--prit)}
.sm{width:auto;min-height:48px;margin:0;padding:6px 14px}
h1{font-size:34px;line-height:1.2;margin:20px 0 8px}h2{font-size:21px;margin:26px 0 8px}
.mut{color:var(--mut);font-size:16px}
textarea{width:100%;min-height:200px;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card.hard{border-width:3px}.card.easy{border-style:solid;border-width:1px}.card.unk{border-style:dotted}.card.ai{border-style:dashed}
.chip{display:inline-block;font-size:14px;font-weight:700;border:2px solid currentColor;border-radius:999px;padding:0 10px;margin:0 6px 4px 0}
.CONTRADICTED{color:var(--bad)}.VERIFIED{color:var(--ok)}.COULDNT_VERIFY{color:var(--unk)}.AI_INTERPRETATION{color:var(--mut)}
.hdr{border:3px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;font-size:22px}
.action{background:var(--acc);color:#1B2430;border-radius:12px;padding:12px 14px;font-weight:700;margin:12px 0}
.strip{display:flex;gap:4px;margin:8px 0}.strip div{flex:1;text-align:center;font-size:13px;padding:6px 2px;border:2px solid var(--mut);border-radius:8px;opacity:.45}
.strip .on{opacity:1;border-color:var(--line);background:var(--pri);color:var(--prit);font-weight:700}
.tl{border-left:3px solid var(--line);margin:8px 0 8px 8px;padding-left:12px}.tl p{margin:6px 0;font-size:16px}
.pay{outline:3px solid var(--acc);outline-offset:2px}
.grid2{display:grid;gap:8px}
details summary{cursor:pointer;min-height:48px;display:flex;align-items:center}
a{color:inherit}
pre{white-space:pre-wrap;font:inherit;margin:0}
.tag{font-size:13px;border:1px solid var(--mut);border-radius:6px;padding:0 6px;color:var(--mut)}
.skip{position:absolute;left:-999px}
</style></head><body>
<main id="app" aria-live="polite"></main>
<script>
// ===== CONFIG (mock mode: renders hand-written ledgers; flip USE_MOCK=false when /api/check exists) =====
const USE_MOCK=true;
const SEBI_CHECK_URL='https://www.sebi.gov.in/'; // [VERIFY] exact SEBI Check URL
const I4C_URL='https://i4c.mha.gov.in/'; // [VERIFY] suspect-repository URL
const SRC=(n)=>({name:n+' [VERIFY]',url:'https://www.sebi.gov.in/',date:'2025'});
const S={lang:(navigator.language||'hi').startsWith('en')?'en':'hi',screen:'pause',text:'',situation:null,ledger:null,redact:null,sebi:null,rec:null};
const L=()=>S.lang, tr=(a)=>a[L()==='hi'?0:1];

// ===== UI chrome strings (B owns) =====
const U={
 pause:['Ruko. 30 second ruk kar check karein.','Pause. Take 30 seconds to check.'],
 sub:['SACH sirf wahi padhta hai jo aap dikhate hain. SMS, OTP, bank ya demat tak koi pahunch nahi.','SACH reads only what you share. No SMS, OTP, bank or demat access.'],
 speak:['🎤 Bolkar batayein','🎤 Speak it'],paste:['📋 Paste karein','📋 Paste it'],shot:['📷 Screenshot (jaldi aa raha hai)','📷 Screenshot (coming soon)'],
 ph:['Sandesh ya poori chat yahan paste karein…','Paste the message or whole chat here…'],
 go:['Aage badhein','Continue'],back:['← Wapas','← Back'],
 sit:['Abhi aapki kya sthiti hai?','What is your situation right now?'],
 s_PREVENTION:['Paise bhejne wala hoon','I am about to pay'],s_ATTEMPTED:['Kisi ne koshish ki','Someone tried'],s_PAID:['Paise bhej diye','I already paid'],s_ONGOING:['Aur paise maang rahe hain','They want more money'],
 checking:['Jaanch ho rahi hai…','Checking…'],steps:[['Daave padh rahe hain','Reading claims'],['Payment dekh rahe hain','Checking payment'],['Process match kar rahe hain','Matching process']].map(x=>x),
 h_HIGH_CONCERN:['Zyada chinta ki baatein','High concern'],h_MIXED:['Mile-jule sanket','Mixed signals'],h_LOW_CONCERN:['Jo hum check kar sake, usme kam chinta','Low concern from what we could check'],h_CANT_VERIFY:['Poori jaanch nahi ho paayi','Can\'t verify enough'],
 lowNote:['Yeh "sab theek hai" ka pramaan nahi hai.','This is not a guarantee of anything.'],
 act:['Aapse kya karne ko kaha ja raha hai','What they are asking you to do'],
 sec_hard:['🔒 Nakal karna mushkil (inpe bharosa karein)','🔒 Hard to fake (rely on these)'],sec_easy:['🪞 Nakal karna aasaan (inpe bharosa na karein)','🪞 Easy to fake (do not rely on these)'],sec_unk:['❓ Pata nahi chal paya','❓ Couldn\'t verify'],sec_ai:['AI ki vyakhya (pramaan nahi)','AI interpretation (not evidence)'],
 lbl_CONTRADICTED:['✖ Mel nahi khata','✖ CONTRADICTED'],lbl_VERIFIED:['✔ Pushti hui','✔ VERIFIED'],lbl_COULDNT_VERIFY:['? Verify nahi hua','? COULDN\'T VERIFY'],lbl_AI_INTERPRETATION:['✦ AI','✦ AI'],
 hard:['nakal mushkil','hard to fake'],easy:['nakal aasaan','easy to fake'],settle:['Isse kaise pata chalega: ','How to settle this: '],src:['Strot','Source'],
 stage:['Sandesh ka charan','Message stage'],stages:[['Hook','Hook'],['Bharosa','Trust'],['Nakli proof/app','Fake proof/app'],['Deposit push','Deposit push'],['Withdraw rukna/fee','Withdrawal blocked/fee']],
 stageNote:['Yeh ek andaza hai, pakka nahi.','An estimate, not a certainty.'],
 next:['Ab kya karein','What to do now'],
 hear:['🔊 Suna do','🔊 Read aloud'],trust:['👨‍👩‍👧 Kisi apne se poochein','👨‍👩‍👧 Ask someone you trust'],paid:['🆘 Paise de diye?','🆘 Already paid?'],
 verify:['SEBI Check par jaanch karein','Verify on SEBI Check'],verifyNote:['Payee copy ho gaya. SEBI ka jawab SACH ko nahi dikhta.','Payee copied. SACH never sees SEBI\'s answer.'],
 ret:['SEBI Check par kya dikha?','What did SEBI Check show?'],r1:['Registered dikha','Showed as registered'],r2:['Nahi mila / registered nahi','Not found / not registered'],r3:['Samajh nahi aaya','Did not understand'],
 conf:['Aapne SEBI Check par confirm kiya: ','Confirmed by you on SEBI Check: '],
 tcTitle:['Apne kisi bharosemand ko bhejein','Send to someone you trust'],wa:['WhatsApp par bhejein','Share via WhatsApp'],copy:['Copy karein','Copy'],copied:['Copy ho gaya','Copied'],
 i4c:['Reported identifiers search karein','Search reported identifiers'],i4cNote:['Yeh jaankari janta ki shikayaton par aadharit hai, adhoori ho sakti hai aur galtiyan ho sakti hain. Koi result na milna matlab sab theek nahi.','Based on public complaints; incomplete and may contain errors. No result does not mean there is no problem.'],
 rec:['Ghabrayein nahi. Abhi yeh karein.','Do not panic. Do this now.'],
 recSteps:[['Aur paise na bhejein.','Stop sending more money.'],['1930 par call karein.','Call 1930.'],['cybercrime.gov.in par report karein.','Report at cybercrime.gov.in.'],['Apne bank ko batayein.','Tell your bank.'],['Share/securities ka mamla ho to SCORES par shikayat karein.','For securities issues, file on SCORES.'],['Screenshot sambhal kar rakhein.','Keep screenshots.']],
 recNote:['Jitna jaldi, utna behtar. Wapasi ka koi vaada nahi.','The sooner the better. No promise of recovery.'],
 inc:['Ghatna ka saar (badal sakte hain)','Incident summary (editable)'],
 priv:['Privacy raseed','Privacy receipt'],pv_dev:['Aapke phone par hi','Stayed on your device'],pv_sent:['Bheja gaya','Sent'],pv_to:['Kisko','To whom'],pv_st:['Store','Stored'],
 none:['Kuch nahi (server par koi log nahi)','Nothing (no server-side logs)'],mock:['Demo mode: haath se likhe nateeje, koi network call nahi','Demo mode: hand-written results, no network call'],
 again:['Naya check','New check'],demo:['Demo sandesh','Demo messages'],
 mic0:['Is browser mein awaaz input nahi','Voice input not supported in this browser'],listen:['Sun raha hoon… bolein','Listening… speak now']
};
const t=(k)=>tr(U[k]);

// ===== mock redaction (A owns the real one) =====
function redact(x){const r={};let o=x;
 o=o.replace(/\b\d{4}\s?\d{4}\s?\d{4}\b/g,()=>(r.id=(r.id||0)+1,'[ID]'));
 o=o.replace(/\b(?:\+91[\s-]?)?[6-9]\d{9}\b/g,()=>(r.phone=(r.phone||0)+1,'[PHONE]'));
 o=o.replace(/[\w.\-]+@[\w\-]+\.[a-z]{2,}\b/gi,()=>(r.email=(r.email||0)+1,'[EMAIL]'));
 o=o.replace(/(otp[^\d]{0,12})\d{4,6}/gi,(m,a)=>(r.otp=(r.otp||0)+1,a+'[OTP]'));
 return{redacted:o,report:r}}

// ===== fixtures (mock ledgers; mirror /fixtures/ledgers) =====
const I=(id,label,f,t,w,s,src)=>({id,label,forgeability:f,t,w,s,source:src});
const FX={
kavita:{header:'HIGH_CONCERN',act:['Aaj hi ek personal-style UPI par ₹X bhejna, aur ghar mein kisi ko na batana.','Send ₹X to a personal-style UPI today, and keep it secret from family.'],stage:4,
 because:['Kyunki sandesh mein paise bhejne ki maang hai.','Because the message asks you to send money.'],payee:{value:'kavita.demo@upi',type:'personal_style'},
 items:[
 I('p1_ipo_upi','CONTRADICTED','hard',['IPO ke liye kisi aur ke UPI par paisa','Paying a personal UPI for an IPO'],['IPO mein aap apne hi UPI se bid karte hain aur paise aapke apne khate mein block hote hain. Yeh SEBI ke bataye tareeke se match nahi karta.','In an IPO you bid with your own UPI and funds are blocked in your own account. This does not match the standard flow described by SEBI.'],['Apne broker ya bank app mein IPO ka bid dekhein.','Check the IPO bid inside your own broker or bank app.'],SRC('SEBI/NSE IPO UPI process')),
 I('p3_named','CONTRADICTED','hard',['"Guaranteed allotment" jaisa daava','"Guaranteed allotment" style claim'],['SEBI ki chetavni mein aise daave dhokhe ke sanket ginaye gaye hain. Yeh unse match karta hai.','SEBI\'s advisory lists such claims as warning signs. This matches them.'],null,SRC('SEBI advisory, Aug 2025')),
 I('payee','COULDNT_VERIFY','hard',['Payee ka UPI SEBI-validated nahi dikhta','Payee UPI does not look SEBI-validated'],['Yeh ek aam vyakti jaisa UPI lagta hai. Hum ise verify nahi kar sake.','It looks like an ordinary personal UPI. We could not verify it.'],['SEBI Check par payee daalkar dekhein.','Search the payee on SEBI Check.'],SRC('SEBI Check')),
 I('p6_reg','COULDNT_VERIFY','easy',['Sandesh mein registration number likha hai','A registration number is quoted'],['Number copy kiya ja sakta hai. Registry mein milna sirf firm ka hona batata hai, ki aap usi se baat kar rahe hain.','A number can be copied. A registry hit shows the firm exists, not that this sender is that firm.'],['Firm ka contact SEBI ke page se lein, chat ke number se nahi.','Get the firm\'s contact from SEBI\'s page, not from numbers in the chat.'],SRC('SEBI intermediary page')),
 I('ai1','AI_INTERPRETATION','easy',['Jaldi aur raaz ka dabav','Urgency and secrecy pressure'],['"Aaj hi" aur "ghar mein mat batana" aapko sochne aur puchne se rokte hain.','"Today only" and "don\'t tell family" stop you from thinking and asking.'],null,null)]},
praveen:{header:'HIGH_CONCERN',act:['₹5,000 "tax" bhejo tabhi apna profit nikal paoge.','Pay ₹5,000 "tax" before you can withdraw your profit.'],stage:5,
 because:['Kyunki paisa nikalne ke liye aur paise maange ja rahe hain.','Because more money is requested to withdraw.'],payee:{value:'tax.fee@upi',type:'personal_style'},
 timeline:[['Tip group mein "sure shot" F&O tips','Hook',1],['Chhota profit dikhaya gaya','Trust',2],['App link (.apk) install karne ko kaha','Fake proof/app',3],['₹5,000 tax bharo, tabhi withdraw','Withdrawal/fee',5]],
 items:[
 I('p4','CONTRADICTED','hard',['Paisa nikalne ke liye naya deposit/fee','New deposit or fee to withdraw'],['Asli platform apna paisa nikalne ke liye naya paisa nahi maangte. Yeh "withdrawal blocked" charan se match karta hai.','Genuine platforms do not need new money to release yours. This matches the withdrawal-blocked stage.'],['Platform ko SEBI ki authorised-app list mein dhundhein.','Look for the platform in SEBI\'s authorised-app list.'],SRC('SEBI fake-app guidance')),
 I('p7_apk','COULDNT_VERIFY','hard',['App store se nahi, .apk link se aaya','App came from an .apk link, not a store'],['Store listing ke bina app ka link bharosa nahi dilata.','An app link without a store listing is not reassuring.'],['Sirf official store ya SEBI list wala app hi use karein.','Use only apps from an official store or SEBI\'s list.'],SRC('SEBI authorised-app list')),
 I('p7_proof','COULDNT_VERIFY','easy',['App mein ₹1.75L profit dikh raha hai','App shows ₹1.75L profit'],['App ya chat ki screen asli munafe ka saboot nahi hoti.','Screens inside a chat or unknown app are not evidence of real returns.'],['Apne bank mein asli paisa aaya ya nahi dekhein.','Check whether real money arrived in your bank.'],SRC('SEBI'))]},
controlA:{header:'LOW_CONCERN',act:['Koi paisa maangne wali baat nahi mili.','No payment request found.'],stage:0,payee:null,
 items:[I('lnk','COULDNT_VERIFY','easy',['Sandesh ka bhejne wala verify nahi hua','Sender could not be verified'],['Hum sirf text dekh sakte hain, bhejne wale ko nahi.','We can only see the text, not who truly sent it.'],['Bank ya broker ke app se seedha dekhein.','Check directly inside your bank or broker app.'],null)]},
controlB:{header:'LOW_CONCERN',act:['Koi paisa maangne wali baat nahi mili.','No payment request found.'],stage:0,payee:null,items:[]}};
function pick(x){const s=x.toLowerCase();
 if(/withdraw|nikal|tax|apk|profit/.test(s))return'praveen';
 if(/ipo|allot|upi|@|guarantee|pay|bhej/.test(s))return'kavita';
 if(/statement|notice|dear customer|bank|contribution/.test(s))return'controlA';return'controlB'}
const DEMOS={kavita:'[12/10/26, 11:47 pm] Sunita: VIP IPO Allotment group. Guaranteed allotment! Registration INH000000000. Aaj hi ₹20,000 bhejiye kavita.demo@upi par. Ghar mein mat batana, last 2 slots.',
 praveen:'Tip group: sure shot F&O call.\nApp install karo: trade-pro.apk\nProfit ₹1.75L ready. Pay ₹5,000 tax to withdraw. tax.fee@upi',
 controlA:'Dear customer, your monthly statement is available in the app. No action needed.',controlB:'Article: how mutual fund SIPs work and why time in the market matters.'};

// ===== helpers =====
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const go=(s)=>{S.screen=s;render();window.scrollTo(0,0)};
function say(txt){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=L()==='hi'?'hi-IN':'en-IN';speechSynthesis.speak(u)} // fallback; /api/tts later
function nextSteps(){const m={PREVENTION:[['Ruk jayein. Paise na bhejein.','Pause. Do not send money.'],['Payee ko SEBI Check par verify karein.','Verify the payee on SEBI Check.'],['Kisi bharosemand se poochein.','Ask someone you trust.']],
 ATTEMPTED:[['Jawab na dein; number aur link block/report karein (I4C aur telecom report).','Do not engage; block and report the number and link (I4C, telecom).'],['Screenshot sambhal kar rakhein.','Keep screenshots.']],
 PAID:[['Abhi samay bahut zaroori hai. Neeche "Paise de diye?" kholein.','Time matters. Open "Already paid?" below.'],['1930 par turant call karein.','Call 1930 right away.']],
 ONGOING:[['Aur paise na bhejein. Paisa nikalne ke liye fee na dein.','Stop paying. Never pay a fee to withdraw.'],['1930 par call karein, phir neeche recovery steps dekhein.','Call 1930, then see the recovery steps below.']]};
 return m[S.situation||'PREVENTION']}
function trustCard(l){const a=l.act?tr(l.act):'';const top=l.items[0]?tr(l.items[0].t):'';
 return L()==='hi'?`Mujhe yeh investment sandesh aaya hai. ${a} SACH ko yeh mila: ${top||'koi bada sanket nahi'}. Kya aap mere saath check kar sakte ho, paise bhejne se pehle?`
 :`I received this investment message. ${a} SACH noted: ${top||'no major signal'}. Can you check it with me before I send any money?`}
function incident(l){const p=l.payee?l.payee.value:'—';return (L()==='hi'?`Taareekh: ${new Date().toLocaleDateString()}\nPayee: ${p}\nDaava: ${l.items[0]?tr(l.items[0].t):'—'}\nPlatform: WhatsApp/Telegram\nRaashi: (bharein)\nLink: (bharein)`:`Date: ${new Date().toLocaleDateString()}\nPayee: ${p}\nClaim: ${l.items[0]?tr(l.items[0].t):'—'}\nPlatform: WhatsApp/Telegram\nAmount: (fill in)\nLinks: (fill in)`)}
async function share(txt){const u='https://wa.me/?text='+encodeURIComponent(txt);window.open(u,'_blank','noopener')}
async function cp(txt,btn){try{await navigator.clipboard.writeText(txt)}catch(e){}if(btn){const o=btn.innerHTML;btn.textContent=t('copied');setTimeout(()=>btn.innerHTML=o,1200)}}

// ===== views =====
const top=()=>`<header><span class="logo">SACH</span><span style="display:flex;gap:8px"><button class="sm" aria-label="Language" onclick="S.lang=L()==='hi'?'en':'hi';render()">${L()==='hi'?'EN':'हिं'}</button></span></header>`;
const V={
pause:()=>`${top()}<h1>${t('pause')}</h1><p class="mut">${t('sub')}</p>
 <button class="pri" onclick="startVoice()">${t('speak')}</button><button onclick="go('input')">${t('paste')}</button><button disabled aria-disabled="true" style="opacity:.55">${t('shot')}</button>
 <p id="vmsg" class="mut"></p>
 <details><summary>${t('demo')}</summary>${Object.keys(DEMOS).map(k=>`<button onclick="S.text=DEMOS['${k}'];go('situation')">${k}</button>`).join('')}</details>`,
input:()=>`${top()}<h1>${t('paste')}</h1><textarea id="tx" maxlength="8000" placeholder="${esc(t('ph'))}" aria-label="${esc(t('ph'))}">${esc(S.text)}</textarea>
 <button class="pri" onclick="S.text=document.getElementById('tx').value.trim();if(S.text)go('situation')">${t('go')}</button><button onclick="go('pause')">${t('back')}</button>`,
situation:()=>`${top()}<h1>${t('sit')}</h1>${['PREVENTION','ATTEMPTED','PAID','ONGOING'].map(k=>`<button class="${k==='PREVENTION'?'pri':''}" onclick="S.situation='${k}';run()">${t('s_'+k)}</button>`).join('')}<button onclick="go('input')">${t('back')}</button>`,
checking:()=>`${top()}<h1>${t('checking')}</h1><div class="card">${U.steps.map(s=>`<p>⏳ ${tr(s)}</p>`).join('')}</div>`,
result:()=>{const l=S.ledger,e=l.items,low=l.header==='LOW_CONCERN';
 const sec=(k,f)=>{const a=e.filter(f);return a.length?`<h2>${t(k)}</h2>`+a.map(item).join(''):''};
 return `${top()}<div class="hdr" role="status">${t('h_'+l.header)}${low?`<div class="mut" style="font-weight:400;font-size:16px">${t('lowNote')}</div>`:''}</div>
 <div class="action"><small>${t('act')}</small><br>${esc(tr(l.act))}</div>
 ${sec('sec_hard',x=>x.forgeability==='hard'&&x.label!=='COULDNT_VERIFY')}${sec('sec_easy',x=>x.forgeability==='easy'&&x.label!=='AI_INTERPRETATION'&&x.label!=='COULDNT_VERIFY')}
 ${sec('sec_unk',x=>x.label==='COULDNT_VERIFY')}${sec('sec_ai',x=>x.label==='AI_INTERPRETATION')}
 ${l.stage?stage(l):''}
 <h2>${t('next')}</h2><div class="card"><ol>${nextSteps().map(x=>`<li>${tr(x)}</li>`).join('')}</ol></div>
 ${S.sebi?`<p class="card">${t('conf')}<b>${S.sebi}</b></p>`:''}
 ${l.payee?`<button class="pri" onclick="verify()">🔍 ${t('verify')}</button>`:''}
 <button onclick="say(speakText())">${t('hear')}</button><button onclick="go('trust')">${t('trust')}</button><button onclick="go('recovery')">${t('paid')}</button>
 <button onclick="window.open(I4C_URL,'_blank','noopener')">🔎 ${t('i4c')}</button><p class="mut">${t('i4cNote')}</p>
 ${privacy()}<button onclick="S.text='';S.situation=null;S.sebi=null;go('pause')">${t('again')}</button>`},
trust:()=>{const x=trustCard(S.ledger);return `${top()}<h1>${t('tcTitle')}</h1><div class="card"><pre id="tc">${esc(x)}</pre></div>
 <button class="pri" onclick="share(trustCard(S.ledger))">${t('wa')}</button><button onclick="cp(trustCard(S.ledger),this)">${t('copy')}</button><button onclick="go('result')">${t('back')}</button>`},
ret:()=>`${top()}<h1>${t('ret')}</h1><button onclick="S.sebi=t('r1');go('result')">${t('r1')}</button><button onclick="S.sebi=t('r2');go('result')">${t('r2')}</button><button onclick="S.sebi=t('r3');go('result')">${t('r3')}</button>`,
recovery:()=>`${top()}<h1>${t('rec')}</h1><div class="card"><ol>${U.recSteps.map(s=>`<li>${tr(s)}</li>`).join('')}</ol></div>
 <a class="btn pri" href="tel:1930">📞 1930</a><p class="mut">${t('recNote')}</p><h2>${t('inc')}</h2>
 <textarea id="inc" style="min-height:160px">${esc(incident(S.ledger))}</textarea>
 <button onclick="cp(document.getElementById('inc').value,this)">${t('copy')}</button><button onclick="share(document.getElementById('inc').value)">${t('wa')}</button><button onclick="go('result')">${t('back')}</button>`};
function item(x){const cls=x.label==='AI_INTERPRETATION'?'ai':x.label==='COULDNT_VERIFY'?'unk':x.forgeability;
 return `<div class="card ${cls}"><span class="chip ${x.label}">${t('lbl_'+x.label)}</span><span class="tag">${x.label==='AI_INTERPRETATION'?'AI':tr(U[x.forgeability])}</span>
 <p style="margin:4px 0"><b>${esc(tr(x.t))}</b></p><p class="mut" style="margin:4px 0">${esc(tr(x.w))}</p>
 ${x.s?`<p style="margin:4px 0">💡 <b>${t('settle')}</b>${esc(tr(x.s))}</p>`:''}${x.source?`<p class="mut" style="margin:4px 0">${t('src')}: <a href="${x.source.url}" target="_blank" rel="noopener">${esc(x.source.name)}</a></p>`:''}</div>`}
function stage(l){return `<h2>${t('stage')}</h2><div class="strip" role="list">${U.stages.map((s,i)=>`<div role="listitem" class="${i+1===l.stage?'on':''}">${i+1}<br>${tr(s)}</div>`).join('')}</div>
 <p class="mut">${esc(tr(l.because))} ${t('stageNote')}</p>
 ${l.timeline?`<div class="tl">${l.timeline.map(m=>`<p class="${m[2]>=4?'pay':''}"><span class="tag">${m[2]}</span> ${esc(m[0])} <span class="tag">${esc(m[1])}</span></p>`).join('')}</div>`:''}`}
function privacy(){const r=S.redact||{},n=Object.keys(r).map(k=>`${k}×${r[k]}`).join(', ')||'—';
 return `<h2>${t('priv')}</h2><div class="card"><p><b>${t('pv_dev')}:</b> ${L()==='hi'?'redaction, jaankari nikalna':'redaction, signal extraction'} (${esc(n)})</p>
 <p><b>${t('pv_sent')}:</b> ${USE_MOCK?(L()==='hi'?'Kuch nahi':'Nothing'):'1 redacted text'}</p><p><b>${t('pv_to')}:</b> ${USE_MOCK?'—':'LLM provider'}</p><p><b>${t('pv_st')}:</b> ${t('none')}</p>${USE_MOCK?`<p class="mut">${t('mock')}</p>`:''}</div>`}
function speakText(){const l=S.ledger;return `${t('h_'+l.header)}. ${tr(l.act)}. ${l.items.filter(x=>x.label!=='AI_INTERPRETATION').slice(0,2).map(x=>tr(x.t)).join('. ')}`}
function verify(){cp(S.ledger.payee.value);window.open(SEBI_CHECK_URL,'_blank','noopener');alert(t('verifyNote'));go('ret')}
async function run(){go('checking');const rd=redact(S.text);S.redact=rd.report;
 await new Promise(r=>setTimeout(r,900)); // USE_MOCK: replace with fetch('/api/check',{redacted_text,signals,situation,lang}) + rules-only fallback
 const f=FX[pick(rd.redacted)];S.ledger={...f,items:f.items};go('result')}
function startVoice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition,m=document.getElementById('vmsg');
 if(!R){m.textContent=t('mic0');return}const r=new R();r.lang='hi-IN';r.onresult=e=>{S.text=e.results[0][0].transcript;go('situation')};r.onerror=()=>{m.textContent=t('mic0')};r.start();m.textContent=t('listen')}
function render(){document.documentElement.lang=L();document.getElementById('app').innerHTML=V[S.screen]()}
render();
</script></body></html>
